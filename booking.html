<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>小時光咖啡館</title>
  <link rel="stylesheet" href="booking.css">
</head>

<body>
  <header>
    <h1>小時光咖啡館</h1>
    <nav class="menu">
      <ul>
        <li><a href="index.html">首頁</a></li>
        <li><a href="menu.html">菜單</a></li>
        <li><a href="booking.html">訂位資訊</a></li>
        <li><a href="news.html">最新消息</a></li>
      </ul>
    </nav>
  </header>
    <main class="content">
    <div class="bookingform">
        <h2>訂位資訊</h2>
        <div class="form-items">
            <label for="name">姓名：</label>
            <input type="text" id="name" class="form-control" placeholder="請輸入姓名" required>
        </div>

        <div class="form-items">
            <label for="people">人數：</label>
            <input type="number" id="people" class="form-control" min="1" max="10" value="1" required>
        </div>

        <div class="form-items">
            <label for="date">日期：</label>
            <input type="date" id="date" class="form-control" required>
        </div>

        <div class="form-items">
            <label for="time">時間：</label>
            <select id="time" class="form-control" required>
                <option value="">請選擇時間</option>
                <option>13:00</option>
                <option>13:30</option>
                <option>14:00</option>
                <option>14:30</option>
                <option>15:00</option>
                <option>15:30</option>
                <option>16:00</option>
                <option>16:30</option>
                <option>17:00</option>
                <option>17:30</option>
                <option>18:00</option>
            </select>
        </div>

        <button class="submit-btn" id="submitBtn">送出訂位</button>

    </div>
    </main>
    <script>
      document.getElementById("submitBtn").addEventListener("click", function () {
        alert("訂位成功！我們期待您的蒞臨");
    });
    </script>

    <footer>
    <p>
      聯絡資訊：0987654321<br>
      營業時間：週一–週日 08:00–20:00
    </p>
  </footer>
</body>
</html>
