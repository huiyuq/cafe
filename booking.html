<!DOCTYPE html>
<html lang="zh-Hant"></html>
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="booking.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
 <script src="scripts/main.js"></script>
</head>

<body>
  <header>
    <img src="logo.png" class="logo" alt="小時光咖啡 Logo">
    <h1>小時光咖啡館</h1>

<div id="nav-icon3">
  <span></span>

  <span></span>
</div>

<nav id="mobile-menu">

    <li><a href="index.html">首頁</a></li>

    <main class="content">
    <div class="bookingform">
        <h2>訂位資訊</h2>
        <div class="form-items">
            <label for="name">姓名：</label>
            <input type="text" id="name" class="form-control" placeholder="請輸入姓名" required>
        </div>

        <div class="form-items">
            <label for="people">人數：</label>
            <input type="number" id="people" class="form-control" min="1" max="10" value="1" required>
        </div>

        <div class="form-items">
            <label for="date">日期：</label>
            <input type="date" id="date" class="form-control" min="2025-12-25" required>
        </div>

        <div class="form-items">
            <label for="time">時間：</label>
            <select id="time" class="form-control" required>
                <option value="">請選擇時間</option>
                <option>10:30</option>
                <option>11:00</option>
                <option>11:30</option>
                <option>12:00</option>
                <option>12:30</option>
                <option>13:00</option>
                <option>13:30</option>
                <option>14:00</option>
                <option>14:30</option>
                <option>15:00</option>
                <option>15:30</option>
                <option>16:00</option>
                <option>16:30</option>
                <option>17:00</option>
                <option>17:30</option>
                <option>18:00</option>
                <option>18:30</option>
                <option>19:00</option>
            </select>
        </div>

        <button class="submit-btn" id="submitBtn">送出訂位</button>
        <script>

document.getElementById("submitBtn").addEventListener("click", function () {
    const name = document.getElementById("name").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    if (name === "" || date === "" || time === "") {
        alert("請填寫完整的訂位資訊喔！");
    } else {
        alert(`訂位成功！`);
    }
});

// 設定日期選擇器最小只能選今天
const today = new Date().toISOString().split('T')[0];
document.getElementById('date').setAttribute('min', today);
</script>
    </main>
    <footer>
    <p>
      聯絡資訊：0987654321<br>
      營業時間：週一–週日 08:00–20:00
    </p>
  </footer>
</body>
</html>
